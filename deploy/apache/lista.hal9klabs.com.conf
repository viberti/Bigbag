# vhost Apache da app "Lista" (lista.hal9klabs.com, porta 80) — 2026-10-16.
# ENDEREÇO PRÓPRIO para a Lista se instalar como app separada no Android: em
# bigbag.hal9klabs.com/lista/ o Chrome dizia "já instalado" porque o âmbito da app BigBag
# ("/") cobre /lista/. Aqui a Lista é a raiz do domínio. MESMO build e MESMO backend do
# BigBag (mesma pasta dist, mesma porta 4200) — não há deploy à parte.
# Instalar (depois do registo DNS A lista → 89.58.29.220):
#   sudo cp deploy/apache/lista.hal9klabs.com.conf /etc/apache2/sites-available/
#   sudo a2ensite lista.hal9klabs.com.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d lista.hal9klabs.com
<VirtualHost *:80>
    ServerName lista.hal9klabs.com
    DocumentRoot /home/dev/bigbag/frontend/dist
    <Directory /home/dev/bigbag/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Backend Node do BigBag (a Lista usa a mesma API).
    ProxyPreserveHost On
    ProxyPass        /api/   http://127.0.0.1:4200/api/
    ProxyPassReverse /api/   http://127.0.0.1:4200/api/
    ProxyPass        /health http://127.0.0.1:4200/health
    ProxyPassReverse /health http://127.0.0.1:4200/health

    RewriteEngine On
    # HTTP -> HTTPS PRIMEIRO (o certbot acrescenta-o no fim, depois das regras abaixo, e aí não corria —
    # http:// servia a página sem redirecionar; corrigido à mão em 2026-10-16)
    RewriteCond %{SERVER_NAME} =lista.hal9klabs.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    # neste domínio a Lista é a RAIZ → manifesto com start_url/scope "/" (o /lista.webmanifest
    # do BigBag aponta para /lista/)
    RewriteRule ^/lista\.webmanifest$ /lista-raiz.webmanifest [L]
    # tudo o que não for /api, /health ou ficheiro real → a página da Lista
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/health
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^ /lista/index.html [L]

    # PWA: service worker e manifestos nunca em cache; assets com hash imutáveis.
    <FilesMatch "(sw\.js|registerSW\.js|\.webmanifest)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
    <Directory /home/dev/bigbag/frontend/dist/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    LimitRequestBody 12582912

    ErrorLog ${APACHE_LOG_DIR}/lista_error.log
    CustomLog ${APACHE_LOG_DIR}/lista_access.log combined
</VirtualHost>
